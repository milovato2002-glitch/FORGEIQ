<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FORGEIQ — Checkout Canceled</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-primary: #0a1628;
      --bg-secondary: #0e1e36;
      --card-bg: #142444;
      --gold: #f0a500;
      --gold-hover: #ffb820;
      --amber: #f4a261;
      --text-primary: #e8edf5;
      --text-secondary: #8fa3c0;
      --text-muted: #4a6080;
      --border-subtle: rgba(255,255,255,0.07);
      --radius-sm: 6px;
      --font-display: 'Bebas Neue', sans-serif;
      --font-condensed: 'Barlow Condensed', sans-serif;
      --font-body: 'Barlow', sans-serif;
    }
    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-body);
      font-weight: 300;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .cancel-icon {
      width: 80px;
      height: 80px;
      background: rgba(244,162,97,0.1);
      border: 2px solid var(--amber);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 32px;
      font-size: 2.4rem;
      color: var(--amber);
    }
    h1 {
      font-family: var(--font-display);
      font-size: clamp(2.4rem, 7vw, 4rem);
      letter-spacing: 6px;
      margin-bottom: 16px;
    }
    .sub {
      color: var(--text-secondary);
      font-size: 1.1rem;
      max-width: 500px;
      margin: 0 auto 12px;
      line-height: 1.7;
    }
    .actions {
      display: flex;
      gap: 16px;
      margin-top: 36px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn-gold {
      display: inline-block;
      background: var(--gold);
      color: var(--bg-primary);
      padding: 16px 48px;
      border-radius: var(--radius-sm);
      font-family: var(--font-condensed);
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }
    .btn-gold:hover {
      background: var(--gold-hover);
      transform: translateY(-2px);
    }
    .btn-outline {
      display: inline-block;
      background: transparent;
      color: var(--text-secondary);
      padding: 16px 48px;
      border-radius: var(--radius-sm);
      font-family: var(--font-condensed);
      font-weight: 600;
      font-size: 1rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-decoration: none;
      border: 1px solid var(--border-subtle);
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-outline:hover {
      border-color: var(--gold);
      color: var(--text-primary);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div class="cancel-icon">&#8617;</div>
  <h1>NO WORRIES.</h1>
  <p class="sub">Checkout was canceled. No charge was made.</p>
  <p class="sub">When you're ready, we'll be here.</p>

  <div class="actions">
    <a href="/pricing.html" class="btn-gold">VIEW PLANS</a>
    <a href="/index.html" class="btn-outline">BACK TO HOME</a>
  </div>

</body>
</html>
